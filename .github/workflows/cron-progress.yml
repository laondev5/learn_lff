name: Module deadline sweep

# Runs the 24-hour module sweep. Each module is open for exactly 24 hours, one per
# day; when a window closes without the module being completed, the student's
# accountability partner is emailed and admins are notified to follow up. The
# endpoint is idempotent (absences are recorded once, notifications are leased),
# so late or repeated runs are safe.
#
# Required repository secrets:
#   APP_URL      e.g. https://lms.example.org   (no trailing slash)
#   CRON_SECRET  the same value as the app's CRON_SECRET env var

on:
  schedule:
    # Every 15 minutes. GitHub can delay scheduled runs at peak times, which is
    # fine because the sweep scores every window that has already closed.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: module-deadline-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep closed module windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configuration
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository secret APP_URL is not set."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."
            exit 1
          fi

      - name: Call /api/cron/progress
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          url="${APP_URL%/}/api/cron/progress"
          echo "POST $url"
          code=$(curl -sS --max-time 300 --retry 2 --retry-delay 15 --retry-connrefused \
            -o response.json -w "%{http_code}" \
            -X POST "$url" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json")
          echo "HTTP ${code}"
          if [ -s response.json ]; then
            cat response.json
            echo
          fi
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Cron endpoint returned HTTP ${code}."
            exit 1
          fi

      - name: Summarise sweep
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s response.json ]; then
            echo "No response body captured."
            exit 0
          fi
          if command -v jq >/dev/null 2>&1; then
            jq -r '
              "| metric | count |",
              "| --- | --- |",
              "| windows evaluated | \(.evaluated // 0) |",
              "| notifications sent | \(.sent // 0) |",
              "| delivery failures | \(.failed // 0) |"
            ' response.json >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat response.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
